<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#14202b; --muted:#667785; --line:#e2e8ee;
  --accent:#0f766e; --accent-soft:#d9f2ee; --danger:#c0392b; --ok:#1e8e5a; --bar:#14b8a6;
  --shadow:0 1px 2px rgba(16,32,48,.06),0 4px 14px rgba(16,32,48,.05);
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e151b; --card:#17212a; --text:#e8eef3; --muted:#8fa2b1; --line:#26333e;
    --accent:#2dd4bf; --accent-soft:#12403c; --danger:#ff7a6b; --ok:#4ade80; --bar:#2dd4bf;
    --shadow:0 1px 2px rgba(0,0,0,.4);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(84px + var(--sab));}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.pill.err{background:#fde4e1;color:var(--danger)} .pill.off{background:var(--line);color:var(--muted)}
.wrap{max-width:920px;margin:0 auto;padding:14px 16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + var(--sab))}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;padding:6px 2px;
  display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;cursor:pointer}
nav button .i{font-size:22px;line-height:1}
nav button.on{color:var(--accent);font-weight:700;background:var(--accent-soft)}
@media (min-width:760px){
  body{padding-bottom:24px}
  nav{position:sticky;top:57px;bottom:auto;border:0;border-bottom:1px solid var(--line);justify-content:center;gap:6px;padding:6px}
  nav button{flex:0 0 auto;flex-direction:row;font-size:15px;gap:8px;padding:8px 18px}
  nav button .i{font-size:18px}
}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:13px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;-webkit-appearance:none;appearance:none;min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
textarea{resize:vertical}
input.amount{font-size:26px;font-weight:800;min-height:56px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:10px 2px;font:inherit;font-size:12.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:68px;position:relative}
.cat span{font-size:25px;line-height:1}
.cat.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--card));font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;
  border-radius:99px;padding:8px 16px;cursor:pointer;min-height:40px}
.seg button.on,.chip.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.seg.basis{flex-wrap:nowrap}
.seg.basis button{flex:1;padding:8px 4px;border-radius:12px;font-size:13.5px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;flex:0 0 auto;padding:6px 12px;min-height:36px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on .dot{box-shadow:0 0 0 2px #fff}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13px;border-radius:99px;padding:5px 12px;cursor:pointer}
.params{background:var(--accent-soft);border-radius:14px;padding:2px 14px 14px;margin-top:14px}
.params .ph{font-size:12px;font-weight:700;color:var(--accent);margin-top:12px;text-transform:uppercase;letter-spacing:.04em}
.params input,.params select{background:var(--card)}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;border-radius:12px;padding:13px 18px;cursor:pointer;min-height:50px}
@media (prefers-color-scheme:dark){.btn{color:#04201d}}
.btn.sec{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.monthnav button{border:1px solid var(--line);background:var(--card);color:var(--text);width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;flex:0 0 auto}
.monthnav .m{font-size:18px;font-weight:700;text-transform:capitalize;text-align:center;flex:1}
.monthnav .m small{display:block;font-size:12px;font-weight:500;color:var(--accent);text-transform:none;cursor:pointer}
.hero{font-size:34px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px}
.up{color:var(--danger);font-weight:600}.down{color:var(--ok);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 10px}.kpi b{display:block;font-size:16px}.kpi small{color:var(--muted);font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.bar-row{margin:12px 0}.bar-row[data-fc]{cursor:pointer}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;align-items:center}
.bar-top>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.bar{height:10px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--bar);border-radius:9px;min-width:3px}
.stack{display:flex;gap:2px;height:18px;border-radius:9px;overflow:hidden;margin-bottom:6px}
.stack i{display:block;min-width:3px}
.cols{display:flex;align-items:flex-end;gap:5px;margin-top:4px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;cursor:pointer;font-size:11px;color:var(--muted)}
.col .v{height:14px;font-size:10px;line-height:14px;white-space:nowrap;color:var(--text);font-weight:700}
.col .plot{height:112px;width:100%;display:flex;align-items:flex-end}
.tower{width:100%;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;opacity:.5;gap:1px}
.tower i{display:block;width:100%;min-height:2px}
.col.on .tower{opacity:1}.col.on{color:var(--text);font-weight:700}
.col .ml{padding-top:5px;text-transform:capitalize}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.exp{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.exp:first-child{border-top:0}
.exp .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:0 0 auto}
.exp .mid{flex:1;min-width:0}.exp .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .amt{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.welcome{text-align:center;padding:28px 18px}.welcome .big{font-size:44px}.welcome h3{margin:8px 0 6px}
.welcome .actions{justify-content:center;flex-wrap:wrap}.welcome .btn{flex:0 1 auto}
details{border-top:1px solid var(--line)}details:first-of-type{border-top:0}
summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary .l{font-weight:600;text-transform:capitalize;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
summary .l small{flex-basis:100%}
.actions.wrapbtns{flex-wrap:wrap}.actions.wrapbtns .btn{flex:1 1 150px}summary .r{text-align:right;font-weight:700}summary small{display:block;color:var(--muted);font-weight:400;text-transform:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);text-align:right;padding:4px 0;font-weight:600}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 0;border-top:1px solid var(--line);text-align:right}
.tbl td:first-child{display:flex;align-items:center;gap:7px}
.settle{background:var(--accent-soft);border-radius:12px;padding:12px;margin-top:12px}
.logrow{font-size:13px;padding:8px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.logrow:first-child{border-top:0}.logrow time{color:var(--muted);flex:0 0 100px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);height:fit-content}
.tag.elimina{background:#fde4e1;color:var(--danger)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + var(--sab));-webkit-overflow-scrolling:touch}
@media (min-width:760px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 4px}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:#14202b;color:#fff;padding:11px 18px;border-radius:99px;
  font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.note{font-size:13px;color:var(--muted)}
.warn{background:#fff4d6;color:#7a5a00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.warn{background:#3a3010;color:#ffd770}.pill.err{background:#4a1f1a}.tag.elimina{background:#4a1f1a}}
code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:13px}
</style>

<script>
/* =====================================================================
   CONFIGURAZIONE FIREBASE
   Lasciata vuota = modalità "Locale" (dati nel browser).
   Puoi incollarla qui oppure dall'app (Impostazioni > Firebase).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyARHzzgnEEIZK5Rn0urKE1qyTg_9gRwuMU",
  authDomain: "spese-a5217.firebaseapp.com",
  projectId: "spese-a5217",
  storageBucket: "spese-a5217.firebasestorage.app",
  messagingSenderId: "1011693206207",
  appId: "1:1011693206207:web:5c6aebbffc872235af240a"
};

/* ------------------------- Categorie e parametri ------------------------- */
const sel = (id,label,options,extra={}) => ({id,label,type:'select',options,...extra});
const CATS = {
  tata: {label:'Tata', icon:'👩‍🍼', color:'#6366f1', fields:[
    sel('tipo','Tipo di costo',['Busta paga','Contributi','Extra ore','Extra weekend','Extra notte'],{required:true}),
    {id:'qty',type:'number',step:'0.5',required:true,
      showIf:p=>/^Extra/.test(p.tipo||''),
      label:p=>p.tipo==='Extra ore'?'Numero di ore':p.tipo==='Extra weekend'?'Numero di weekend / giorni':'Numero di notti',
      unit:p=>p.tipo==='Extra ore'?'h':p.tipo==='Extra weekend'?'giorno':'notte'}
  ]},
  spesa: {label:'Spesa', icon:'🛒', color:'#22c55e', fields:[
    sel('negozio','Dove',['Supermercato','Alimentari / mercato','Online','Casa / pulizia','Altro'])
  ]},
  medicine: {label:'Medicine', icon:'💊', color:'#ef4444', fields:[
    {id:'per',label:'Per chi',type:'text',placeholder:'es. Marco'},
    sel('tipo','Tipo',['Farmaco con ricetta','Farmaco da banco','Parafarmaco','Visita / ticket','Altro'])
  ]},
  scuola: {label:'Scuola', icon:'🎒', color:'#f59e0b', fields:[
    {id:'figlio',label:'Figlio/a',type:'text',placeholder:'es. Sofia'},
    sel('voce','Voce',['Retta','Mensa','Libri','Materiale','Gita','Attività extra','Altro'])
  ]},
  divertimento: {label:'Divertimento', icon:'🎉', color:'#ec4899', fields:[
    sel('tipo','Tipo',['Cinema / teatro','Sport','Giochi / giocattoli','Eventi / parchi','Abbonamenti','Altro'])
  ]},
  viaggi: {label:'Viaggi', icon:'✈️', color:'#06b6d4', fields:[
    {id:'destinazione',label:'Destinazione',type:'text',placeholder:'es. Lisbona'},
    sel('voce','Voce',['Trasporto','Alloggio','Attività','Altro'])
  ]},
  ristorazione: {label:'Ristorazione', icon:'🍽️', color:'#f97316', fields:[
    {id:'locale',label:'Locale',type:'text',placeholder:'es. Trattoria da Gino'},
    {id:'persone',label:'Numero di persone',type:'number',step:'1'}
  ]},
  bar: {label:'Bar', icon:'☕', color:'#a16207', fields:[
    {id:'locale',label:'Locale',type:'text',placeholder:'es. Bar Centrale'},
    sel('tipo','Tipo',['Colazione','Caffè / aperitivo','Gelato','Altro'])
  ]}
};
const SUBKEY = {tata:'tipo',spesa:'negozio',medicine:'tipo',scuola:'voce',divertimento:'tipo',viaggi:'voce',ristorazione:'locale',bar:'tipo'};
const catColor = k => CATS[k]?.color||'#64748b';

/* Colori per sotto-tipo */
const TATA_COLORS = {'Busta paga':'#3b82f6','Contributi':'#8b5cf6','Extra ore':'#f59e0b','Extra weekend':'#ec4899','Extra notte':'#ef4444'};
const PALETTE = ['#3b82f6','#f59e0b','#ec4899','#10b981','#8b5cf6','#ef4444','#06b6d4','#84cc16'];
function subColor(cat,val){
  if(cat==='tata' && TATA_COLORS[val]) return TATA_COLORS[val];
  const f=CATS[cat]?.fields.find(x=>x.id===SUBKEY[cat]);
  let i=f&&f.options?f.options.indexOf(val):-1;
  if(i<0){ i=0; for(const ch of String(val)) i=(i*31+ch.charCodeAt(0))%997; }
  return PALETTE[i%PALETTE.length];
}
const RATE_FIELDS = [
  {tipo:'Extra ore',label:'Extra ore',unit:'€ / ora'},
  {tipo:'Extra weekend',label:'Extra weekend',unit:'€ / giorno'},
  {tipo:'Extra notte',label:'Extra notte',unit:'€ / notte'}
];

/* ------------------------------ Utilità ------------------------------ */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);
const eur0 = n => new Intl.NumberFormat('it-IT',{maximumFractionDigits:0}).format(Math.round(n||0));
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const ym = s => s.slice(0,7);
const shiftM = (m,d) => { const [y,mo]=m.split('-').map(Number); const dt=new Date(y,mo-1+d,1); return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}`; };
const mLabel = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'}); };
const mShort = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('it-IT',{month:'short'}).replace('.',''); };
const dLabel = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'}); };
const uid = () => (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const parseAmt = v => { const n=parseFloat(String(v).trim().replace(/\s/g,'').replace(',','.')); return isFinite(n)?Math.round(n*100)/100:NaN; };
const sum = a => a.reduce((t,e)=>t+e.amount,0);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2600); }
function group(list,keyFn){ const m={}; list.forEach(e=>{const k=keyFn(e)||'—'; (m[k]=m[k]||[]).push(e);}); return m; }

/* ------------------------------ Stato ------------------------------ */
const LS = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const Q = new URLSearchParams(location.search), HQ = new URLSearchParams(location.hash.slice(1));
const FORCE_LOCAL = Q.has('local');
const S = {
  view:'add', mode:'local', fbError:'',
  expenses: LS.get('sc_expenses',[]),
  log: LS.get('sc_log',[]),
  settings: Object.assign({payers:['Papà','Mamma'],rates:{}},LS.get('sc_settings',{})),
  fbConfig: LS.get('sc_fbconfig',null),
  ui: Object.assign({basis:'pay'},LS.get('sc_ui',{})),
  month: ym(today()),
  fcat:'',                 // filtro tipo (condiviso tra Mese e Storico)
  histMode:'month', histType:'tata', payPeriod:'month', logFilter:'all'
};
Object.defineProperty(S,'basis',{get(){return S.ui.basis;},set(v){S.ui.basis=v;LS.set('sc_ui',S.ui);}});
let FB=null, DB=null, unsubs=[];
const persist = () => { if(S.mode==='local'){ LS.set('sc_expenses',S.expenses); LS.set('sc_log',S.log); } };
const rate = tipo => { const r=S.settings.rates&&S.settings.rates[tipo]; return r>0?r:0; };
const device = () => /iPhone/.test(navigator.userAgent)?'iPhone':/iPad|Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1?'iPad':/Android/.test(navigator.userAgent)?'Android':'PC';

/* Mese di attribuzione: per data di pagamento o per competenza */
const cm = e => e.competenza || e.params?.competenza || ym(e.date);
const mk = e => S.basis==='comp' ? cm(e) : ym(e.date);
const inMonth = (list,m) => list.filter(e=>mk(e)===m);
const byFilter = list => S.fcat ? list.filter(e=>e.category===S.fcat) : list;

/* --------------------------- Dati: salvataggio + log --------------------------- */
function describe(e){
  const c=CATS[e.category]; if(!c) return e.category;
  const p=e.params||{}, parts=[];
  c.fields.forEach(f=>{
    if(f.showIf && !f.showIf(p)) return;
    let v=p[f.id]; if(v===undefined||v===''||v===null) return;
    if(f.type==='number'){ v = f.unit? `${String(v).replace('.',',')} ${f.unit(p)==='h'?'h':f.unit(p)==='giorno'?(v==1?'giorno':'giorni'):(v==1?'notte':'notti')}` : (f.id==='persone'?`${v} pers.`:v); }
    parts.push(v);
  });
  return parts.join(' · ');
}
function logAction(action,e){
  const entry={id:uid(),ts:Date.now(),action,expenseId:e.id,
    summary:`${CATS[e.category]?.label||e.category} ${eur(e.amount)} – ${e.payer} (${e.date})`,
    device:device(),mode:S.mode};
  if(S.mode==='firebase'){ FB.setDoc(FB.doc(DB,'log',entry.id),entry).catch(err=>console.warn('log',err)); }
  else { S.log.unshift(entry); S.log=S.log.slice(0,500); persist(); }
}
function saveExpense(e,isNew){
  e.updatedAt=Date.now(); if(isNew) e.createdAt=e.updatedAt;
  if(S.mode==='firebase'){
    FB.setDoc(FB.doc(DB,'spese',e.id),e).catch(err=>{ toast('Errore Firebase: '+err.code); S.fbError=err.message; });
  } else {
    const i=S.expenses.findIndex(x=>x.id===e.id);
    if(i>=0) S.expenses[i]=e; else S.expenses.push(e);
    persist();
  }
  logAction(isNew?'crea':'modifica',e);
}
function deleteExpense(e){
  if(S.mode==='firebase'){ FB.deleteDoc(FB.doc(DB,'spese',e.id)).catch(err=>toast('Errore Firebase: '+err.code)); }
  else { S.expenses=S.expenses.filter(x=>x.id!==e.id); persist(); }
  logAction('elimina',e);
}

/* ------------------------------ Firebase ------------------------------ */
function activeConfig(){
  if(FORCE_LOCAL) return null;
  if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) return FIREBASE_CONFIG;
  if(S.fbConfig && S.fbConfig.apiKey && S.fbConfig.projectId) return S.fbConfig;
  return null;
}
function setStatus(kind,text){ const p=$('#status'); p.className='pill '+(kind==='ok'?'':kind==='err'?'err':'off'); p.textContent=text; }
async function connectFirebase(cfg){
  disconnectFirebase();
  setStatus('off','Connessione…');
  try{
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,F,Au]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js'),import(base+'firebase-auth.js')]);
    const app=A.initializeApp(cfg);
    try{ await Au.signInAnonymously(Au.getAuth(app)); }catch(e){ console.warn('Auth anonima non disponibile:',e.code); }
    DB=F.getFirestore(app);
    FB={doc:F.doc,setDoc:F.setDoc,deleteDoc:F.deleteDoc,collection:F.collection,writeBatch:F.writeBatch};
    S.mode='firebase'; S.fbError='';
    const onErr=err=>{ S.fbError=err.code+': '+err.message; setStatus('err','Errore Firebase'); render(); };
    unsubs.push(F.onSnapshot(F.collection(DB,'spese'),snap=>{
      S.expenses=snap.docs.map(d=>d.data());
      setStatus('ok',snap.metadata.fromCache?'Firebase · offline':'Firebase · online'); render();
    },onErr));
    unsubs.push(F.onSnapshot(F.query(F.collection(DB,'log'),F.orderBy('ts','desc'),F.limit(300)),snap=>{
      S.log=snap.docs.map(d=>d.data()); if(S.view==='set') render();
    },onErr));
  }catch(err){
    S.mode='local'; S.fbError=String(err.message||err);
    S.expenses=LS.get('sc_expenses',[]); S.log=LS.get('sc_log',[]);
    setStatus('err','Errore connessione'); render();
  }
}
function disconnectFirebase(){
  unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[]; FB=null; DB=null;
  if(S.mode==='firebase'){ S.mode='local'; S.expenses=LS.get('sc_expenses',[]); S.log=LS.get('sc_log',[]); }
  setStatus('off','Locale');
}
function parseConfigText(t){
  const o={}; let m; const re=/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g;
  while((m=re.exec(t))) o[m[1]]=m[2];
  return o;
}

/* ------------------------------ Form spesa ------------------------------ */
function mountForm(root,init,opt){
  const st={cat:init.category||'',amount:init.amount!=null?String(init.amount).replace('.',','):'',date:init.date||today(),
            payer:init.payer||S.settings.payers[0],note:init.note||'',p:{...(init.params||{})}};
  st.comp = init.id ? cm(init) : ym(st.date);
  st.compAuto = st.comp===ym(st.date);
  const payers=[...new Set([...S.settings.payers,...(init.payer?[init.payer]:[])])];

  function qtyHint(){
    const r=rate(st.p.tipo), q=parseAmt(st.p.qty||'');
    const u=st.cat==='tata'?CATS.tata.fields[1].unit(st.p):'';
    if(!r) return '💡 Imposta la tariffa in Impostazioni per calcolare l\'importo in automatico';
    return `Tariffa ${eur(r)} / ${u}`+(q>0?` → <b>${eur(r*q)}</b>`:'');
  }
  function autoAmount(){
    const r=rate(st.p.tipo), q=parseAmt(st.p.qty||'');
    if(st.cat==='tata' && r>0 && q>0) st.amount=String(Math.round(r*q*100)/100).replace('.',',');
  }
  function compSelect(){
    const center=/^\d{4}-\d{2}/.test(st.date)?ym(st.date):ym(today());
    const opts=[]; for(let i=-12;i<=3;i++) opts.push(shiftM(center,i));
    if(!opts.includes(st.comp)) opts.push(st.comp);
    opts.sort();
    return `<select id="f-comp">${opts.map(o=>`<option value="${o}" ${o===st.comp?'selected':''}>${mLabel(o)}${o===center?' (stesso mese)':''}</option>`).join('')}</select>`;
  }
  function paramsHTML(){
    const c=CATS[st.cat]; if(!c) return '';
    let h=`<div class="params"><div class="ph">${c.icon} Dettagli ${esc(c.label)}</div>`;
    c.fields.forEach(f=>{
      if(f.showIf && !f.showIf(st.p)) return;
      const label=typeof f.label==='function'?f.label(st.p):f.label;
      const v=st.p[f.id]??'';
      h+=`<label>${esc(label)}${f.required?' *':''}</label>`;
      if(f.id==='qty'){
        h+=`<input data-p="qty" type="text" inputmode="decimal" value="${esc(String(v).replace('.',','))}" placeholder="0">
            <div class="note" id="qtyhint" style="margin-top:6px">${qtyHint()}</div>`;
      } else if(f.type==='select'){
        h+=`<select data-p="${f.id}"><option value="">Seleziona…</option>${f.options.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
      } else if(f.type==='number'){
        h+=`<input data-p="${f.id}" type="text" inputmode="decimal" value="${esc(String(v).replace('.',','))}">`;
      } else {
        h+=`<input data-p="${f.id}" type="text" value="${esc(v)}" placeholder="${esc(f.placeholder||'')}" autocapitalize="sentences">`;
      }
    });
    return h+'</div>';
  }
  function draw(){
    root.innerHTML=`<form novalidate>
      <div class="lbl" style="margin-top:0">Che spesa è? *</div>
      <div class="cats">${Object.entries(CATS).map(([k,c])=>`<button type="button" class="cat ${st.cat===k?'on':''}" style="--c:${c.color}" data-cat="${k}"><span>${c.icon}</span>${esc(c.label)}</button>`).join('')}</div>
      ${paramsHTML()}
      <div class="row2">
        <div><label>Importo (€) *</label><input id="f-amount" class="amount" type="text" inputmode="decimal" placeholder="0,00" value="${esc(st.amount)}"></div>
        <div><label>Data pagamento *</label><input id="f-date" type="date" value="${esc(st.date)}">
          <div class="quick"><button type="button" data-qd="0">Oggi</button><button type="button" data-qd="-1">Ieri</button></div></div>
      </div>
      <label>Mese di competenza <span style="font-weight:400">(a quale mese si riferisce)</span></label>
      <div id="compwrap">${compSelect()}</div>
      <label>Chi l'ha sostenuta *</label>
      <div class="seg">${payers.map(p=>`<button type="button" data-payer="${esc(p)}" class="${st.payer===p?'on':''}">${esc(p)}</button>`).join('')}</div>
      <label>Commenti</label>
      <textarea id="f-note" rows="2" placeholder="Note libere (facoltativo)">${esc(st.note)}</textarea>
      <div class="actions">${opt.extra||''}<button class="btn" type="submit">${opt.submitLabel||'Salva spesa'}</button></div>
    </form>`;
  }
  function setDate(v){
    st.date=v;
    if(st.compAuto && /^\d{4}-\d{2}-\d{2}$/.test(v)) st.comp=ym(v);
    const w=$('#compwrap',root); if(w) w.innerHTML=compSelect();
  }
  root.onclick=ev=>{
    const c=ev.target.closest('[data-cat]'); if(c){ if(st.cat!==c.dataset.cat){ st.cat=c.dataset.cat; st.p={}; draw(); } return; }
    const p=ev.target.closest('[data-payer]'); if(p){ st.payer=p.dataset.payer; draw(); return; }
    const q=ev.target.closest('[data-qd]'); if(q){ const d=new Date(); d.setDate(d.getDate()+Number(q.dataset.qd)); setDate(dstr(d)); draw(); return; }
    if(opt.onClick) opt.onClick(ev);
  };
  root.oninput=ev=>{
    const t=ev.target;
    if(t.id==='f-amount') st.amount=t.value; else if(t.id==='f-note') st.note=t.value;
    else if(t.id==='f-date') setDate(t.value);
    else if(t.dataset.p && t.tagName!=='SELECT'){
      st.p[t.dataset.p]=t.value;
      if(t.dataset.p==='qty'){
        autoAmount();
        const a=$('#f-amount',root); if(a) a.value=st.amount;
        const h=$('#qtyhint',root); if(h) h.innerHTML=qtyHint();
      }
    }
  };
  root.onchange=ev=>{
    const t=ev.target;
    if(t.id==='f-date') setDate(t.value);
    else if(t.id==='f-comp'){ st.comp=t.value; st.compAuto=(st.comp===ym(st.date)); }
    else if(t.dataset.p && t.tagName==='SELECT'){
      st.p[t.dataset.p]=t.value; if(t.dataset.p==='tipo'){ delete st.p.tariffa; autoAmount(); } draw();
    }
  };
  root.onsubmit=ev=>{
    ev.preventDefault();
    if(!st.cat) return toast('Scegli il tipo di spesa');
    const amount=parseAmt(st.amount); if(!(amount>0)) return toast('Inserisci un importo valido');
    if(!st.date) return toast('Inserisci la data');
    if(!st.payer) return toast('Indica chi ha pagato');
    const c=CATS[st.cat], params={};
    for(const f of c.fields){
      if(f.showIf && !f.showIf(st.p)) continue;
      let v=(st.p[f.id]??'').toString().trim();
      if(f.required && !v) return toast(`Compila: ${typeof f.label==='function'?f.label(st.p):f.label}`);
      if(f.type==='number' && v){ const n=parseAmt(v); if(isNaN(n)) return toast('Valore numerico non valido'); v=n; }
      if(v!=='') params[f.id]=v;
    }
    if(st.cat==='tata' && params.qty){ const t=st.p.tariffa||rate(params.tipo); if(t) params.tariffa=Number(t); }
    opt.onSave({id:init.id||uid(),category:st.cat,amount,date:st.date,competenza:st.comp||ym(st.date),payer:st.payer,note:st.note.trim(),params,createdAt:init.createdAt},st);
  };
  draw();
}

/* rows: [labelHtml, value, color, filterKey] */
function bars(rows,total){
  if(!rows.length) return '<div class="empty">Nessun dato</div>';
  const max=Math.max(...rows.map(r=>r[1]));
  return rows.map(([l,v,col,key])=>`<div class="bar-row" ${key?`data-fc="${esc(key)}"`:''}><div class="bar-top"><span>${col?`<i class="dot" style="background:${col}"></i>`:''}${l}</span><span><b>${eur(v)}</b>${total?` <span class="sub">${Math.round(v/total*100)}%</span>`:''}</span></div>
    <div class="bar"><i style="width:${max?v/max*100:0}%${col?`;background:${col}`:''}"></i></div></div>`).join('');
}
function stack(rows,total){
  if(!total) return '';
  return `<div class="stack">${rows.map(r=>`<i title="${esc(r[0])}" style="width:${r[1]/total*100}%;background:${r[2]}"></i>`).join('')}</div>`;
}
/* Colonne impilate: per tipo di spesa (nessun filtro) o per sotto-voce (filtro attivo) */
function trendCols(list,months,sel,showAll){
  const cat=S.fcat;
  const keyOf=cat?(e=>e.params?.[SUBKEY[cat]]||'—'):(e=>e.category);
  const colOf=cat?(k=>subColor(cat,k)):catColor;
  const labOf=cat?(k=>k):(k=>CATS[k]?.label||k);
  const data=months.map(m=>{ const l=inMonth(list,m), g={}; l.forEach(e=>{const k=keyOf(e); g[k]=(g[k]||0)+e.amount;}); return {m,tot:sum(l),g}; });
  const max=Math.max(...data.map(d=>d.tot),1), H=112;
  const keys=[]; data.forEach(d=>Object.keys(d.g).forEach(k=>{ if(!keys.includes(k)) keys.push(k); }));
  if(!cat) keys.sort((a,b)=>Object.keys(CATS).indexOf(a)-Object.keys(CATS).indexOf(b));
  const cols=data.map(d=>{
    const th=d.tot/max*H;
    const segs=keys.filter(k=>d.g[k]).map(k=>`<i style="height:${Math.max(d.g[k]/d.tot*th,2).toFixed(1)}px;background:${colOf(k)}" title="${esc(labOf(k))}: ${eur(d.g[k])}"></i>`).join('');
    const show=showAll||d.m===sel;
    return `<div class="col ${d.m===sel?'on':''}" data-pick="${d.m}"><div class="v">${show&&d.tot?eur0(d.tot):''}</div>
      <div class="plot"><div class="tower" style="height:${d.tot?Math.max(th,2):0}px">${segs}</div></div><div class="ml">${mShort(d.m)}</div></div>`;
  }).join('');
  const legend=keys.length?`<div class="legend">${keys.map(k=>`<span><i class="dot" style="background:${colOf(k)}"></i>${esc(labOf(k))}</span>`).join('')}</div>`:'';
  return `<div class="cols">${cols}</div>${legend}`;
}
function monthNav(label,step,sub){

    <div class="m">${label}${sub||''}</div><button data-mn="${step}" aria-label="Successivo">›</button></div>`;
}

    <button class="${S.basis==='comp'?'on':''}" data-basis="comp">🗓️ Competenza</button></div>
    <div class="note" style="margin:6px 2px 12px">${S.basis==='pay'?'Ogni spesa è contata nel mese in cui è stata pagata.':'Ogni spesa è contata nel mese a cui si riferisce (competenza).'}</div>`;

function welcome(){
  return `<div class="card welcome"><div class="big">🏠</div><h3>Ancora nessuna spesa</h3>
    <p class="sub" style="margin:0 0 14px">Inserisci la prima spesa per vedere statistiche e storico.</p>

function settlement(byPayer,tot){
  if(!tot) return '';
  const n=byPayer.length, share=tot/n;
  if(n===2){
    const [a,b]=byPayer, d=a[1]-share;
    return `<div class="settle">${Math.abs(d)<0.005?'✅ Siete in pari (50/50).':
      d>0?`<b>${esc(b[0])}</b> dovrebbe dare <b>${eur(d)}</b> a <b>${esc(a[0])}</b> per dividere a metà.`
         :`<b>${esc(a[0])}</b> dovrebbe dare <b>${eur(-d)}</b> a <b>${esc(b[0])}</b> per dividere a metà.`}</div>`;
  }
  return `<div class="settle">Quota equa a testa: <b>${eur(share)}</b><br>${byPayer.map(([p,v])=>`${esc(p)}: ${v-share>=0?'+':''}${eur(v-share)}`).join(' · ')}</div>`;
}

      const cats=Object.keys(CATS).filter(k=>cur.some(e=>e.category===k));
      const title=per==='all'?'Tutto lo storico':per==='year'?`Anno ${y}`:mLabel(m);
      body=`<div class="seg" style="margin-bottom:10px">${[['month','Mese'],['year','Anno'],['all','Sempre']].map(([k,l])=>`<button class="${per===k?'on':''}" data-pp="${k}">${l}</button>`).join('')}</div>
        ${per==='all'?'':monthNav(per==='year'?y:mLabel(m),per==='year'?12:1,monthSub())}${catChips()}
        <div class="card"><h2>Chi ha pagato · ${esc(title)}</h2><div class="hero">${eur(tot)}</div>
          <div style="margin-top:12px">${bars(byPayer.map(([p,v],i)=>[esc(p),v,PALETTE[i%PALETTE.length]]),tot)}</div>
          ${settlement(byPayer,tot)}</div>
        ${cats.length?`<div class="card"><h2>Per tipo di spesa</h2><table class="tbl"><tr><th></th>${names.map(n=>`<th>${esc(n)}</th>`).join('')}<th>Totale</th></tr>
          ${cats.map(k=>{const l=cur.filter(e=>e.category===k);return `<tr><td><i class="dot" style="background:${catColor(k)}"></i>${esc(CATS[k].label)}</td>${names.map(n=>`<td>${eur(sum(l.filter(e=>e.payer===n)))}</td>`).join('')}<td><b>${eur(sum(l))}</b></td></tr>`;}).join('')}</table></div>`:''}`;
    }
    $('#app').innerHTML=`<div class="seg basis" style="margin-bottom:12px">
      <button class="${mode==='month'?'on':''}" data-hm="month">📅 Mese</button>
      <button class="${mode==='type'?'on':''}" data-hm="type">🏷️ Tipo</button>
      <button class="${mode==='payer'?'on':''}" data-hm="payer">👥 Chi ha pagato</button></div>
      ${mode==='type'?'':basisBar()}${body}`;
  },
  set(){
    const fromFile=FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId;
    const logs=S.log.filter(l=>S.logFilter==='all'||l.action===S.logFilter);
    $('#app').innerHTML=`
      <div class="card"><h2>Firebase</h2>
        <p style="margin:0 0 8px">Stato: <b>${S.mode==='firebase'?'collegato ✅':'non collegato (dati solo su questo dispositivo)'}</b></p>
        ${S.fbError?`<div class="warn">⚠️ ${esc(S.fbError)}</div>`:''}
        ${fromFile?'<p class="note">Configurazione letta dal file <code>index.html</code>.</p>':`
        <label style="margin-top:0">Incolla la configurazione web del progetto Firebase</label>
        <textarea id="fbtxt" rows="7" placeholder='{ "apiKey": "...", "authDomain": "...", "projectId": "...", "storageBucket": "...", "messagingSenderId": "...", "appId": "..." }'>${S.fbConfig?esc(JSON.stringify(S.fbConfig,null,2)):''}</textarea>
        <div class="actions"><button class="btn sec" id="fbdisc">Scollega</button><button class="btn" id="fbsave">Salva e collega</button></div>`}
        ${S.mode==='firebase'&&LS.get('sc_expenses',[]).length?`<button class="btn sec block" id="upload" style="margin-top:12px">⬆️ Carica su Firebase le ${LS.get('sc_expenses',[]).length} spese salvate in locale</button>`:''}
      </div>
      <div class="card"><h2>👩‍🍼 Tariffe Tata</h2>
        <p class="note" style="margin:0">Con una tariffa impostata, in "Inserisci" indichi ore / giorni / notti e l'importo si calcola da solo (resta modificabile). Senza tariffa l'importo è manuale.</p>
        ${RATE_FIELDS.map(r=>`<label>${esc(r.label)} (${esc(r.unit)})</label>
          <input data-rate="${esc(r.tipo)}" type="text" inputmode="decimal" placeholder="0,00" value="${rate(r.tipo)?String(rate(r.tipo)).replace('.',','):''}">`).join('')}
        <div class="actions"><button class="btn" id="saverates">Salva tariffe</button></div></div>
      <div class="card"><h2>Chi sostiene le spese</h2>
        <label style="margin-top:0">Nomi separati da virgola</label><input id="payers" value="${esc(S.settings.payers.join(', '))}">
        <div class="actions"><button class="btn" id="savepayers">Salva nomi</button></div></div>
      <div class="card"><h2>Dati</h2>
        <div class="actions wrapbtns" style="margin-top:0"><button class="btn sec" id="csv">⬇️ Esporta CSV</button>
        ${S.mode==='local'?'<button class="btn sec" id="demo">🧪 Dati di esempio</button><button class="btn sec" id="wipe">🗑️ Cancella dati locali</button>':''}</div></div>
      <div class="card"><h2>Registro attività (log)</h2>
        <div class="chips" style="margin-bottom:8px">${[['all','Tutti'],['crea','Creazioni'],['modifica','Modifiche'],['elimina','Eliminazioni']].map(([k,l])=>`<button class="chip ${S.logFilter===k?'on':''}" data-lf="${k}">${l}</button>`).join('')}</div>
        ${logs.length?logs.slice(0,100).map(l=>`<div class="logrow"><time>${new Date(l.ts).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</time>
          <span class="tag ${esc(l.action)}">${esc(l.action)}</span><span style="flex:1">${esc(l.summary)} <span class="sub">· ${esc(l.device||'')}</span></span></div>`).join(''):'<div class="empty">Nessuna attività registrata</div>'}
      </div>`;
  }
};
function render(){ (VIEWS[S.view]||VIEWS.add)(); document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view)); }

/* ------------------------------ Modifica spesa ------------------------------ */
function openEdit(id){
  const e=S.expenses.find(x=>x.id===id); if(!e) return;
  $('#overlay').classList.add('show');
  $('#sheet').innerHTML=`<h3>Modifica spesa</h3><div id="editroot"></div>`;
  mountForm($('#editroot'),e,{submitLabel:'Salva modifiche',
    extra:'<button class="btn danger" type="button" data-del="1">🗑️</button><button class="btn sec" type="button" data-close="1">Annulla</button>',
    onClick:ev=>{
      if(ev.target.closest('[data-close]')) closeSheet();
      if(ev.target.closest('[data-del]')){ if(confirm('Eliminare questa spesa?')){ deleteExpense(e); closeSheet(); toast('Spesa eliminata'); render(); } }
    },
    onSave:(n)=>{ n.createdAt=e.createdAt; saveExpense(n,false); closeSheet(); toast('✅ Modifiche salvate'); render(); }});
}
function closeSheet(){ $('#overlay').classList.remove('show'); $('#sheet').innerHTML=''; }
$('#overlay').addEventListener('click',ev=>{ if(ev.target.id==='overlay') closeSheet(); });

/* ------------------------------ Eventi globali ------------------------------ */
$('#nav').addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(b){ S.view=b.dataset.v; render(); window.scrollTo(0,0); } });
$('#app').addEventListener('click',ev=>{
  const t=ev.target, q=s=>t.closest(s);
  let x;
  if((x=q('[data-edit]'))) return openEdit(x.dataset.edit);
  if((x=q('[data-go]'))){ S.view=x.dataset.go; return render(); }
  if(q('[data-now]')){ S.month=ym(today()); return render(); }
  if((x=q('[data-mn]'))){ S.month=shiftM(S.month,+x.dataset.mn); return render(); }
  if((x=q('[data-pick]'))){ S.month=x.dataset.pick; if(S.view==='month'||S.view==='hist') return render(); }
  if((x=q('[data-basis]'))){ S.basis=x.dataset.basis; return render(); }
  if((x=q('[data-hm]'))){ S.histMode=x.dataset.hm; return render(); }
  if((x=q('[data-pp]'))){ S.payPeriod=x.dataset.pp; return render(); }
  if((x=q('[data-fc]'))){ S.fcat=x.dataset.fc; return render(); }
  if((x=q('[data-ht]'))){ S.histType=x.dataset.ht; return render(); }
  if((x=q('[data-lf]'))){ S.logFilter=x.dataset.lf; return render(); }
  if(q('#fbsave')){
    const cfg=parseConfigText($('#fbtxt').value);
    if(!cfg.apiKey||!cfg.projectId) return toast('Configurazione incompleta (servono apiKey e projectId)');
    S.fbConfig=cfg; LS.set('sc_fbconfig',cfg); connectFirebase(cfg).then(()=>{ toast(S.mode==='firebase'?'Collegato a Firebase':'Connessione non riuscita'); render(); });
    return;
  }
  if(q('#fbdisc')){ S.fbConfig=null; LS.set('sc_fbconfig',null); disconnectFirebase(); toast('Scollegato'); return render(); }
  if(q('#saverates')){
    const rates={};
    document.querySelectorAll('[data-rate]').forEach(i=>{ const n=parseAmt(i.value||'0'); if(n>0) rates[i.dataset.rate]=n; });
    S.settings.rates=rates; LS.set('sc_settings',S.settings); return toast('Tariffe salvate');
  }
  if(q('#savepayers')){
    const p=$('#payers').value.split(',').map(s=>s.trim()).filter(Boolean);
    if(!p.length) return toast('Inserisci almeno un nome');
    S.settings.payers=[...new Set(p)]; LS.set('sc_settings',S.settings); return toast('Nomi salvati');
  }
  if(q('#upload')){
    const loc=LS.get('sc_expenses',[]); if(!confirm(`Caricare ${loc.length} spese su Firebase?`)) return;
    loc.forEach(e=>FB.setDoc(FB.doc(DB,'spese',e.id),e).catch(err=>toast('Errore: '+err.code)));
    logAction('crea',{id:'bulk',category:'spesa',amount:0,payer:'import',date:today()});
    LS.set('sc_expenses',[]); toast('Caricamento avviato'); return render();
  }
  if(q('#csv')) return exportCSV();
  if(q('#demo')) return loadDemo();
  if(q('#wipe')){ if(confirm('Cancellare tutte le spese e il log locali?')){ S.expenses=[]; S.log=[]; persist(); toast('Dati locali cancellati'); render(); } return; }
});

function exportCSV(){
  const rows=[['Data pagamento','Mese competenza','Tipo','Dettagli','Importo','Pagato da','Commenti','Creata il']];
  [...S.expenses].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>rows.push([e.date,cm(e),CATS[e.category]?.label||e.category,describe(e),String(e.amount).replace('.',','),e.payer,e.note||'',e.createdAt?new Date(e.createdAt).toLocaleString('it-IT'):'']));
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`spese-casa-${today()}.csv`; document.body.appendChild(a); a.click(); a.remove();
}
function loadDemo(){
  const P=S.settings.payers, now=new Date(), out=[];
  const add=(back,day,cat,amt,params,note='',payer,compBack)=>{
    const d=new Date(now.getFullYear(),now.getMonth()-back,day), c=new Date(now.getFullYear(),now.getMonth()-(compBack??back),1);
    out.push({id:uid(),category:cat,amount:amt,date:dstr(d),competenza:`${c.getFullYear()}-${pad(c.getMonth()+1)}`,payer:payer||P[out.length%P.length],note,params,createdAt:Date.now()+out.length,updatedAt:Date.now()});
  };
  for(let b=0;b<6;b++){
    add(b,1,'tata',1100,{tipo:'Busta paga'},'',P[0],b+1);           // pagata a inizio mese per il mese precedente
    add(b,16,'tata',320+b*10,{tipo:'Contributi'},'',P[0]);
    add(b,9,'tata',60,{tipo:'Extra ore',qty:5,tariffa:12},'Serata fuori',P[1]);
    if(b%2===0) add(b,20,'tata',90,{tipo:'Extra weekend',qty:1,tariffa:90});
    if(b%3===1) add(b,12,'tata',60,{tipo:'Extra notte',qty:1,tariffa:60});
    add(b,3,'spesa',92.4+b*7,{negozio:'Supermercato'},'',P[1]);
    add(b,11,'spesa',64.8,{negozio:'Alimentari / mercato'});
    add(b,19,'spesa',110.2-b*3,{negozio:'Supermercato'});
    add(b,6,'medicine',23.5,{per:'Sofia',tipo:'Farmaco con ricetta'},'Antibiotico');
    add(b,14,'scuola',280,{figlio:'Sofia',voce:'Retta'});
    add(b,5,'divertimento',36+b*4,{tipo:'Cinema / teatro'},'Film di sabato');
    add(b,22,'ristorazione',78,{locale:'Trattoria da Gino',persone:4});
    add(b,8,'bar',12.5,{locale:'Bar Centrale',tipo:'Colazione'});
    add(b,24,'bar',9,{locale:'Bar Centrale',tipo:'Gelato'});
  }
  add(2,15,'viaggi',540,{destinazione:'Lisbona',voce:'Alloggio'},'Weekend lungo');
  add(2,13,'viaggi',210,{destinazione:'Lisbona',voce:'Trasporto'});
  S.expenses.push(...out); out.forEach(e=>S.log.unshift({id:uid(),ts:Date.now(),action:'crea',expenseId:e.id,summary:`${CATS[e.category].label} ${eur(e.amount)} – ${e.payer} (${e.date})`,device:device(),mode:'local'}));
  persist(); toast(`Caricate ${out.length} spese di esempio`); render();
}

/* ------------------------------ Avvio ------------------------------ */
if(HQ.get('v')) S.view=HQ.get('v');
if(HQ.has('cat')) S.fcat=HQ.get('cat');
if(HQ.get('basis')) S.ui.basis=HQ.get('basis');
if(HQ.get('hm')) S.histMode=HQ.get('hm');
if(HQ.get('ht')) S.histType=HQ.get('ht');
if(HQ.get('pp')) S.payPeriod=HQ.get('pp');
if(Q.has('demo') && !S.expenses.length) loadDemo();
render();
const cfg0=activeConfig();
if(cfg0) connectFirebase(cfg0);
</script>
</body>
</html>
